<div class="fondo">
  <div class="card">

    <div class="brand">
      <div class="brand-name">DDeLI Postres 🍒</div>
      <div class="brand-sub">
        Crea tu cuenta y empieza a disfrutar
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

      <div class="form-body">

        <!-- Nombre -->
        <div class="field-group-wrap">

          <label for="nombre">Nombre</label>

          <div class="field-group">
            <i class="ti ti-user field-icon" aria-hidden="true"></i>

            <input
              type="text"
              id="nombre"
              name="nombre"
              [(ngModel)]="registerData.username"
              placeholder="Ej: María Rodríguez"
              required
              minlength="3"
              #nombre="ngModel"
            >
          </div>

          <div *ngIf="nombre.invalid && nombre.touched" class="error">

            <div *ngIf="nombre.errors?.['required']">
              El nombre es requerido
            </div>

            <div *ngIf="nombre.errors?.['minlength']">
              Mínimo 3 caracteres
            </div>

          </div>
        </div>

        <!-- Email -->
        <div class="field-group-wrap">

          <label for="email">Correo electrónico</label>

          <div class="field-group">
            <i class="ti ti-mail field-icon" aria-hidden="true"></i>

            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="registerData.email"
              placeholder="tu@correo.com"
              required
              email
              #email="ngModel"
            >
          </div>

          <div *ngIf="email.invalid && email.touched" class="error">

            <div *ngIf="email.errors?.['required']">
              Correo requerido
            </div>

            <div *ngIf="email.errors?.['email']">
              Correo inválido
            </div>

          </div>
        </div>

        <!-- Teléfono -->
        <div class="field-group-wrap">

          <label for="telefono">Teléfono</label>

          <div class="field-group">
            <i class="ti ti-phone field-icon" aria-hidden="true"></i>

            <input
              type="tel"
              id="telefono"
              name="telefono"
              [(ngModel)]="registerData.telefono"
              placeholder="3001234567"
              required
              pattern="[0-9]{7,15}"
              #telefono="ngModel"
            >
          </div>

          <div *ngIf="telefono.invalid && telefono.touched" class="error">

            <div *ngIf="telefono.errors?.['required']">
              Teléfono requerido
            </div>

            <div *ngIf="telefono.errors?.['pattern']">
              Solo números (7 a 15 dígitos)
            </div>

          </div>
        </div>

        <!-- Password -->
        <div class="field-group-wrap">

          <label for="password">Contraseña</label>

          <div class="field-group">
            <i class="ti ti-lock field-icon" aria-hidden="true"></i>

            <p-password
              id="password"
              name="password"
              [(ngModel)]="registerData.password"
              [toggleMask]="true"
              placeholder="Mínimo 6 caracteres"
              required
              [minlength]="6"
              #password="ngModel"
              autocomplete="off"
              [feedback]="false">
            </p-password>

          </div>

          <div *ngIf="password.invalid && password.touched" class="error">

            <div *ngIf="password.errors?.['required']">
              Contraseña requerida
            </div>

            <div *ngIf="password.errors?.['minlength']">
              Mínimo 6 caracteres
            </div>

          </div>
        </div>

      </div>

      <!-- Botón -->
      <button
        type="submit"
        [disabled]="registerForm.invalid || isLoading">

        <span *ngIf="!isLoading">
          Crear mi cuenta
        </span>

        <span *ngIf="isLoading" class="loading-content">
          <i class="ti ti-loader-2 spinner"></i>
          Creando cuenta...
        </span>

      </button>

      <!-- Link login -->
      <div class="link-box">
        <span>¿Ya tienes cuenta?</span>

        <a routerLink="/inicio" class="link-accent">
          Inicia sesión
        </a>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Success -->
      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>

    </form>

  </div>
</div>
